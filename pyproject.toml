[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haashi"
dynamic = ["version"] # ... version = "2.0.0" line removed entirely
description = "A modular Python toolkit for reusable utilities."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Haashiraaa", email = "terryfregene.dev@gmail.com"}
]
maintainers = [
    {name = "Haashiraaa", email = "terryfregene.dev@gmail.com"}
]
keywords = [
    "utilities",
    "logging",
    "benchmarking",
    "toolkit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "pyright>=1.1.411",
    "autopep8>=2.3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
# Version is read from haashi.__version__ (src/haashi/__init__.py).
# Do NOT add a static `version = "..."` under [project] above — setuptools
# will error if both are present. To bump the version, edit __version__
# in src/haashi/__init__.py only; this file doesn't need touching.
version = {attr = "haashi.__version__"}


[project.urls]
Homepage = "https://github.com/Haashiraaa"
Repository = "https://github.com/Haashiraaa/haashi"
Documentation = "https://github.com/Haashiraaa/haashi/blob/main/README.md"
Issues = "https://github.com/Haashiraaa/haashi/issues"
