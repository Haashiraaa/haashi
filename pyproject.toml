[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haashi"
version = "2.0.0"
description = "A modular Python toolkit for reusable utilities."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Haashiraaa"}
]
keywords = [  
    "utilities",
    "logging",
    "benchmarking",
    "toolkit"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pyright",
    "autopep8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "haashi.__version__"}


[project.urls]
Homepage = "https://github.com/Haashiraaa"
Repository = "https://github.com/Haashiraaa/haashi"
Documentation = "https://github.com/Haashiraaa/haashi/blob/main/README.md"
Issues = "https://github.com/Haashiraaa/haashi/issues"
