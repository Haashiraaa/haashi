name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        run: pyright

      - name: Tests
        run: pytest --cov=haashi --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel, then validate the PyPI metadata
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Install the built wheel outside the repo and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          import importlib.metadata as md
          import importlib.resources as res
          import haashi

          assert haashi.__version__ == md.version("haashi"), "version mismatch"
          runtime = [r for r in (md.requires("haashi") or []) if "extra ==" not in r]
          assert not runtime, f"haashi must have zero runtime dependencies, got {runtime}"
          assert res.files("haashi").joinpath("py.typed").is_file(), "py.typed missing"
          print("ok", haashi.__version__)
          PY
